name: Notify code repository

# 이 저장소(사적인 데이터)가 바뀌면 코드 저장소의 배포를 부른다. 이 저장소에선 이것만 돈다 (비공개 저장소는 Actions 시간이 유료라 가볍게).
#   push(하객 이미지·map-data.js·사진) / 방명록 Discussion 작성·수정·삭제 → 코드 저장소 deploy.yml
#   방명록 작성·수정 → 코드 저장소 fill-motions.yml (빠진 동작 이미지 채우기)
# 필요한 설정 (Settings → Secrets and variables → Actions):
#   vars.CODE_REPO     코드 저장소 "owner/repo" (GitHub Pages가 있는 공개 저장소)
#   secrets.CODE_TOKEN 코드 저장소 Actions 읽기/쓰기 권한이 있는 fine-grained PAT
on:
  push:
    branches: [main]
  discussion:
    types: [created, edited, deleted, category_changed]
  workflow_dispatch:

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          GH_TOKEN: ${{ secrets.CODE_TOKEN }}
          REPO: ${{ vars.CODE_REPO }}
          FILL: ${{ github.event_name == 'discussion' && (github.event.action == 'created' || github.event.action == 'edited') }}
        run: |
          gh workflow run deploy.yml -R "$REPO" --ref main
          if [ "$FILL" = true ]; then gh workflow run fill-motions.yml -R "$REPO" --ref main; fi
